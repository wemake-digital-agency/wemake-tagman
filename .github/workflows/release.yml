# Builds the plugin zip and publishes it on the GitHub release when a version tag (v1.37) is pushed.
#
# The release must never be public without wemake-tagman.zip: copies 1.34.1-1.35 update straight from the
# latest GitHub release and, when it has no zip, fall back to GitHub's source archive (wrong folder name, the plugin
# would end up deactivated). So the release is created as a draft, the zip is attached, and only then it is published.
# Release by pushing a tag. A release created in the GitHub web UI is public before the zip is added.
#
# The Wemake update server (repository.wemake.co.il) reads the latest release and offers it to sites.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check that the tag matches the plugin version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^[0-9]{1,4}(\.[0-9]{1,4}){1,3}$ ]]; then
            echo "Tag must look like v1.37, got: $GITHUB_REF_NAME"; exit 1
          fi
          HEADER=$(grep -m1 -E '^[[:space:]]*(\*[[:space:]]*)?Version:' wemake_tagman.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST=$(grep -m1 -E 'define\("WMTM_PLUGIN_VERSION"' wemake_tagman.php | sed -E "s/.*\"WMTM_PLUGIN_VERSION\",[[:space:]]*'([^']+)'.*/\1/" | tr -d '[:space:]')
          if [ "$HEADER" != "$TAG" ] || [ "$CONST" != "$TAG" ]; then
            echo "Version mismatch: tag $TAG, Version header $HEADER, WMTM_PLUGIN_VERSION $CONST. Bump both in wemake_tagman.php first."; exit 1
          fi

      - name: Lint PHP
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          set -euo pipefail
          mkdir -p build/wemake-tagman
          # Plugin files only: README, docs/ and CLAUDE.md never go to sites
          cp -r assets inc languages lib wemake_tagman.php build/wemake-tagman/
          (cd build && zip -rqX ../wemake-tagman.zip wemake-tagman)
          unzip -l wemake-tagman.zip | grep -q ' wemake-tagman/wemake_tagman.php$'
          unzip -l wemake-tagman.zip | grep -q ' wemake-tagman/inc/class-wemake-update-client.php$'
          unzip -l wemake-tagman.zip | tail -3

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Created in the web UI: attach the zip as soon as possible
            gh release upload "$GITHUB_REF_NAME" wemake-tagman.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" wemake-tagman.zip \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'wemake-tagman.zip'
